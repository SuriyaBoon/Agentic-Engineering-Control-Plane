[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-engineering-control-plane"
version = "0.1.0"
description = "Read-only multi-agent audit control plane for GitHub repositories"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ae-control = "ae_control_plane.cli:main"

[tool.setuptools.packages.find]
include = ["ae_control_plane*"]
